name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (an existing tag is built as-is; a missing one is created on the selected branch)'
        required: true

permissions:
  contents: write

concurrency:
  group: android-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi

      # Build an existing tag's own commit so a manual run can't publish branch code under it.
      - name: Resolve source ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git/ref returns an array of prefix matches when the exact tag is missing.
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            -q 'if type == "object" then .ref else empty end' 2>/dev/null || true)
          if [ "$found" = "refs/tags/$TAG" ]; then
            echo "SOURCE_REF=refs/tags/$TAG" >> "$GITHUB_ENV"
          else
            echo "SOURCE_REF=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build web app
        run: bun run build

      - name: Sync Android project
        run: bunx cap sync android

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Refusing to publish an APK that cannot upgrade earlier installs."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${TAG#v}" -PversionCode="${{ github.run_number }}"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/anywhere-reader-$TAG.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: anywhere-reader-${{ env.TAG }}
          path: out/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" out/*.apk --clobber
